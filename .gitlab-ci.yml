# .gitlab-ci.yml -- CI/CD pipeline for srl-agent
# Stages: lint -> test -> deploy

stages:
  - lint
  - test
  - deploy

# -------------------------------------------
# LINT
# -------------------------------------------
vue-lint:
  stage: lint
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
  rules:
    - changes:
        - frontend/**/*

python-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 backend/app --max-line-length=120 --exclude=__pycache__
  rules:
    - changes:
        - backend/**/*

# -------------------------------------------
# TEST
# -------------------------------------------
python-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgresql
  variables:
    POSTGRES_USER: chat
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: srl_chat_test
    PG_HOST: postgresql
    PG_PORT: "5432"
    PG_USER: chat
    PG_PASSWORD: test_password
    PG_DB: srl_chat_test
    BASE_URL: http://localhost:11434
    API_KEY: test
    MODEL: llama3.2
    DISABLE_LLM: "true"
    SECRET_KEY: test_secret
    ADMIN_PASSWORD: test_admin
    OLLAMA_NUM_PREDICT: "256"
    OLLAMA_NUM_CTX: "2048"
  before_script:
    - pip install --quiet poetry
    - cd backend
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-ansi --no-root
  script:
    # pgvector extension, tables and seed data (same as docker-compose startup)
    - python -m app.database.setup_no_embed
    # tests live in the repository root (../tests), not in backend/
    - python -m pytest ../tests/ -v --tb=short
  rules:
    - changes:
        - backend/**/*
        - tests/**/*

vue-build:
  stage: test
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - NODE_OPTIONS=--openssl-legacy-provider npm run build
  artifacts:
    paths:
      - backend/static/lti/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - frontend/**/*

# -------------------------------------------
# DEPLOY: static project page from public/ (GitLab Pages)
# -------------------------------------------
pages:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Publishing public/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - public/**/*
