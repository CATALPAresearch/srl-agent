# .gitlab-ci.yml -- CI/CD pipeline for srl-chat
# Stages: lint -> test -> deploy (image built on server, no registry needed)

stages:
  - lint
  - test
  - deploy

# -------------------------------------------
# LINT
# -------------------------------------------
vue-lint:
  stage: lint
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint || true
  rules:
    - changes:
        - frontend/**/*

python-lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 backend/app --max-line-length=120 --exclude=__pycache__ || true
  rules:
    - changes:
        - backend/**/*

# -------------------------------------------
# TEST
# -------------------------------------------
python-test:
  stage: test
  image: python:3.11-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgresql
  variables:
    POSTGRES_USER: chat
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: srl_chat_test
    PG_HOST: postgresql
    PG_PORT: "5432"
    PG_USER: chat
    PG_PASSWORD: test_password
    PG_DB: srl_chat_test
    BASE_URL: http://localhost:11434
    API_KEY: test
    MODEL: llama3.2
    DISABLE_LLM: "true"
    SECRET_KEY: test_secret
    ADMIN_PASSWORD: test_admin
    OLLAMA_NUM_PREDICT: "256"
    OLLAMA_NUM_CTX: "2048"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libpq-dev gcc
    - cd backend
    - pip install -r requirements.txt --quiet
    - pip install pytest --quiet
  script:
    - python -m pytest tests/ -v --tb=short || true
  allow_failure: true
  rules:
    - changes:
        - backend/**/*

# Builds the AMD bundle; artifact is transferred to the server by deploy-production.
vue-build:
  stage: test
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - NODE_OPTIONS=--openssl-legacy-provider npm run build
  artifacts:
    paths:
      - backend/static/lti/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - frontend/**/*

# -------------------------------------------
# DEPLOY -- no registry; image is built on the server
# -------------------------------------------
deploy-production:
  stage: deploy
  image: alpine:latest
  needs:
    - job: vue-build
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client bash rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Transfer the compiled frontend bundle to the server
    - rsync -az backend/static/lti/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backend/static/lti/
    # Pull latest code, rebuild image locally on server, restart stack
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        git pull origin main &&
        docker compose build api &&
        docker compose run --rm api python -m app.database.setup_no_embed &&
        docker compose up -d --remove-orphans
      "
  environment:
    name: production
    url: https://$DEPLOY_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
