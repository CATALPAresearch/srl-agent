# .gitlab-ci.yml — CI/CD pipeline for srl-chat
# Stages: lint → test → build → deploy

stages:
  - lint
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/srl-chat-api
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ─────────────────────────────────────────
# LINT
# ─────────────────────────────────────────
vue-lint:
  stage: lint
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint || true   # warn only for now
  rules:
    - changes:
        - frontend/**/*

python-lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 backend/app --max-line-length=120 --exclude=__pycache__ || true
  rules:
    - changes:
        - backend/**/*

# ─────────────────────────────────────────
# TEST
# ─────────────────────────────────────────
python-test:
  stage: test
  image: python:3.11-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgresql
  variables:
    POSTGRES_USER: chat
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: srl_chat_test
    PG_HOST: postgresql
    PG_PORT: "5432"
    PG_USER: chat
    PG_PASSWORD: test_password
    PG_DB: srl_chat_test
    BASE_URL: http://localhost:11434
    API_KEY: test
    MODEL: llama3.2
    DISABLE_LLM: "true"
    SECRET_KEY: test_secret
    ADMIN_PASSWORD: test_admin
    OLLAMA_NUM_PREDICT: "256"
    OLLAMA_NUM_CTX: "2048"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libpq-dev gcc
    - cd backend
    - pip install -r requirements.txt --quiet
  script:
    - python -m pytest tests/ -v --tb=short
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - backend/**/*
        - tests/**/*

# Builds the AMD bundle to backend/static/lti/ (the actual webpack output path).
# The artifact is picked up by build-push-api in the next stage.
vue-build:
  stage: test
  image: node:18-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - NODE_OPTIONS=--openssl-legacy-provider npm run build
  artifacts:
    paths:
      - backend/static/lti/   # webpack outputs here, not frontend/dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"   # always rebuild on main for deploy
    - changes:
        - frontend/**/*

# ─────────────────────────────────────────
# BUILD + PUSH  (single job — separate DinD instances cannot share images)
# ─────────────────────────────────────────
build-push-api:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest ./backend
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        git pull origin main &&
        IMAGE_TAG=$IMAGE_TAG bash infrastructure/scripts/deploy.sh $IMAGE_TAG
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
