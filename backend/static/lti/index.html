<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SRL Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #app {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Filled by the backend after a verified LTI launch (backend/app/lti.py):
    // server-issued identity incl. signed token; never derived from the URL.
    window.SRL_CLIENT = "lti";
    window.SRL_CONFIG = __SRL_CONFIG__;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.8/require.min.js"></script>
  <script>
    require.config({
      baseUrl: "/static/lti",
      waitSeconds: 30,
      paths: {
        core: "/static/lti/core"
      }
    });
    require(["app-lazy"], function () {
      console.log("SRL Agent LTI UI loaded");
    });
  </script>
</body>
</html>
