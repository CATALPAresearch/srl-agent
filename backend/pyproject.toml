[tool.poetry]
name = "SRL Chat"
version = "0.1.0"
description = "LLM Agent that conducts an interview with students about their learning strategies."
authors = ["nise <niels.seidel@fernuni-hagen.de>"]
package-mode = false

[tool.poetry.dependencies]
# Only what the backend imports or runs. Transitive packages are resolved (and kept
# up to date) by poetry.lock - do not pin them here. Check with: poetry run pip-audit
python = ">=3.12,<3.13"
flask = "^3.1.3"
flask-cors = "^6.0.0"
flask-migrate = "^4.1.0"
flask-sqlalchemy = "^3.1.1"
sqlalchemy = "^2.0.30"
# PostgreSQL driver; SQLAlchemy >= 2.1 uses psycopg (v3) for postgresql:// URLs
psycopg = {extras = ["binary"], version = "^3.2"}
pgvector = ">=0.3.3"
numpy = ">=1.26.4"
pydantic = "^2.11.0"
requests = "^2.33.0"
python-dotenv = "^1.2.2"
gunicorn = ">=23.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-timeout = "^2.4.0"
pip-audit = "^2.10.1"
time-machine = "^3.6.0"

[tool.pytest.ini_options]
testpaths = ["../tests"]
markers = [
    "timeout: per-test timeout in seconds",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
