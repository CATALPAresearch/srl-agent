<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRL Agent</title>
  <meta name="description" content="SRL Agent: Ein KI-Interview für selbstreguliertes Lernen" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #212529;
      --muted: #6c757d;
      --accent: #0d6efd;
      --rule: #dee2e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b;
        --fg: #e9ecef;
        --muted: #adb5bd;
        --accent: #6ea8fe;
        --rule: #343a40;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }
    h1 { font-size: 2rem; line-height: 1.25; margin-top: 0; }
    h2 { margin-top: 2.5rem; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
    img { max-width: 100%; height: auto; }
    figure { margin: 2rem 0; text-align: center; }
    figure img { border: 1px solid var(--rule); border-radius: 6px; }
    figcaption { margin-top: 0.5rem; font-size: 0.9rem; color: var(--muted); }
    li { margin-bottom: 0.4rem; overflow-wrap: anywhere; }
    .error { color: #dc3545; }
  </style>
</head>
<body>
  <main id="content">Lade …</main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    fetch("readme.md")
      .then(function (res) {
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        return res.text();
      })
      .then(function (md) {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(function (err) {
        document.getElementById("content").innerHTML =
          '<p class="error">readme.md konnte nicht geladen werden (' + err.message + ').</p>';
      });
  </script>
</body>
</html>
