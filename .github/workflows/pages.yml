name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build index.html from readme.md
        run: >
          docker run --rm -v "$PWD:/data" -u "$(id -u):$(id -g)" pandoc/core:3.6
          public/readme.md -f markdown -s -c style.css -V lang=de
          --metadata pagetitle="SRL Agent" -o public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
