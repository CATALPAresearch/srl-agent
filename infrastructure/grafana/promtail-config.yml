server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: srl-agent-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: srl-agent-api
          __path__: /var/log/srl-agent/*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\] (?P<level>\w+) in (?P<module>[^:]+): (?P<message>.+)$'
      - labels:
          level:
          module:
