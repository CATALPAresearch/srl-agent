server {
    listen 80;
    server_name srl-agent.fernuni-hagen.de catalpa-p-interviews-vm.fernuni-hagen.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://srl-agent.fernuni-hagen.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name srl-agent.fernuni-hagen.de catalpa-p-interviews-vm.fernuni-hagen.de;

    ssl_certificate     /etc/letsencrypt/live/srl-agent.fernuni-hagen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srl-agent.fernuni-hagen.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
