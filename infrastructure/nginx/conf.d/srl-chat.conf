# Rate limits per client IP (see the /reply and session locations below)
limit_req_zone $binary_remote_addr zone=srl_reply:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=srl_session:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name srl-agent.fernuni-hagen.de catalpa-p-interviews-vm.fernuni-hagen.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://srl-agent.fernuni-hagen.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name srl-agent.fernuni-hagen.de catalpa-p-interviews-vm.fernuni-hagen.de;

    ssl_certificate     /etc/letsencrypt/live/srl-agent.fernuni-hagen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srl-agent.fernuni-hagen.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never publish source maps (readable frontend source code)
    location ~* \.map$ {
        return 404;
    }

    # Grafana is not published: it holds all logs. Use an SSH tunnel (see README-technical.md).

    # LLM endpoints: per-IP limits as a second line of defence (the API also limits each user
    # to 10 messages/minute and 50 per interview). Generous, because many students may share
    # one IP (campus NAT / VPN).
    location = /reply {
        limit_req zone=srl_reply burst=30 nodelay;
        client_max_body_size 32k;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location ~ ^/(startConversation|resetConversation|session/identity)$ {
        limit_req zone=srl_session burst=40 nodelay;
        client_max_body_size 32k;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
