services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/srl-chat-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - BASE_URL=${BASE_URL}
      - API_KEY=${API_KEY}
      - MODEL=${MODEL}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-256}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-2048}
      - EMBEDDING_URL=${EMBEDDING_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_TOKEN=${EMBEDDING_TOKEN}
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
      - INTERVIEW_PROTOCOL=${INTERVIEW_PROTOCOL:-interview_default}
      - DISABLE_LLM=${DISABLE_LLM:-false}
      - USE_RAG_STRATEGY=${USE_RAG_STRATEGY:-false}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    expose:
      - 5000
    volumes:
      - ./backend/logs:/api/logs:z
      - ./backend/config:/api/config:ro,z
      - ./backend/static:/api/static:ro,z
      - ./frontend:/frontend:ro,z
    command: >
      sh -c "python -m app.database.setup_no_embed &&
             gunicorn app:app -b 0.0.0.0:5000 --timeout 300 --workers 2"
    networks:
      - bot-net
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro,z
      - nginx-logs:/var/log/nginx
    networks:
      - bot-net
    depends_on:
      - api

  postgresql:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${PG_DB} -U ${PG_USER}"]
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - bot-net

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    expose:
      - 3100   # internal only — access via Grafana datasource
    volumes:
      - loki-data:/loki
      - ./infrastructure/grafana/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bot-net

  promtail:
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    volumes:
      - ./backend/logs:/var/log/srl-chat:ro,z
      - ./infrastructure/grafana/promtail-config.yml:/etc/promtail/config.yml:ro,z
    command: -config.file=/etc/promtail/config.yml
    networks:
      - bot-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - bot-net
    depends_on:
      - loki

volumes:
  pgdata:
    name: srl-chat-pgdata
  loki-data:
    name: srl-chat-loki
  grafana-data:
    name: srl-chat-grafana
  nginx-logs:
    name: srl-chat-nginx-logs

networks:
  bot-net:
    name: srl-chat-bot-net
